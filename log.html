<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Workout | Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .set-group {
      margin: 10px 0;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
    }
    .set-group h4 {
      font-size: 14px;
      color: var(--color-accent);
      margin-bottom: 8px;
    }
    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .input-row label {
      margin-bottom: 4px;
    }
    .input-row input {
      margin-bottom: 0;
    }
    .set-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 15px 0;
    }
    .set-controls button {
      font-size: 13px;
      padding: 10px;
    }
    .rest-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr;
      gap: 12px;
      align-items: center;
    }
    .rest-row input {
      margin-bottom: 0;
    }
    .rest-row button {
      padding: 11px;
    }
    #timerDisplay {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--color-warning);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center glow-text" style="margin-top: 15px; margin-bottom: 10px;">📝 Log Workout</h2>

    <form id="log-form">
      <div class="card">
        <label for="workout-input">🏋️ Search or Type Exercise</label>
        <input 
          type="text" 
          id="workout-input" 
          name="workout" 
          list="workout-list" 
          placeholder="Start typing (e.g., Bench Press)..." 
          required
          autocomplete="off"
        />
        <datalist id="workout-list">
          <!-- Options added dynamically -->
        </datalist>
        <span style="font-size: 12px; color: var(--text-secondary);">💡 Search suggestions appear as you type.</span>
      </div>

      <div class="card">
        <label for="date">📅 Workout Date</label>
        <input type="date" id="date" name="date" required />
      </div>

      <div class="card rest-card">
        <h3 style="font-size: 16px; margin-bottom: 10px;">⏱️ Rest Timer</h3>
        <div class="rest-row">
          <input type="number" id="restInput" placeholder="Seconds (e.g., 60)" min="10" />
          <button type="button" id="startTimer">Start Rest</button>
        </div>
        <p id="timerDisplay"></p>
      </div>

      <div class="card">
        <h3 style="font-size: 16px; margin-bottom: 10px;">💪 Sets & Reps</h3>
        <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">
          ⚖️ Enter weights in kg (decimals allowed, e.g., 7.5)
        </p>

        <div class="sets-section">
          <!-- Sets dynamically managed. First 3 generated in HTML for speed -->
          <div class="set-group">
            <h4>Set 1</h4>
            <div class="input-row">
              <div>
                <label for="set1-reps">Reps</label>
                <input type="number" id="set1-reps" min="0" placeholder="12" required />
              </div>
              <div>
                <label for="set1-weight">Weight (kg)</label>
                <input type="number" id="set1-weight" min="0" step="0.5" placeholder="20" required />
              </div>
            </div>
          </div>

          <div class="set-group">
            <h4>Set 2</h4>
            <div class="input-row">
              <div>
                <label for="set2-reps">Reps</label>
                <input type="number" id="set2-reps" min="0" placeholder="10" required />
              </div>
              <div>
                <label for="set2-weight">Weight (kg)</label>
                <input type="number" id="set2-weight" min="0" step="0.5" placeholder="22.5" required />
              </div>
            </div>
          </div>

          <div class="set-group">
            <h4>Set 3</h4>
            <div class="input-row">
              <div>
                <label for="set3-reps">Reps</label>
                <input type="number" id="set3-reps" min="0" placeholder="8" required />
              </div>
              <div>
                <label for="set3-weight">Weight (kg)</label>
                <input type="number" id="set3-weight" min="0" step="0.5" placeholder="25" required />
              </div>
            </div>
          </div>
        </div>

        <div class="set-controls">
          <button type="button" id="add-set-btn" class="btn-secondary">➕ Add Set</button>
          <button type="button" id="remove-set-btn" class="btn-secondary">➖ Remove Set</button>
        </div>
      </div>

      <div class="card">
        <label for="notes">📝 Notes (Optional)</label>
        <textarea id="notes" name="notes" rows="3" placeholder="How did the workout feel?"></textarea>
      </div>

      <button type="submit" class="submit-btn" style="width: 100%; margin-top: 10px; font-size: 16px; padding: 14px;">✅ Save Workout Log</button>
    </form>
    
    <div id="status" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
  </div>

  <script type="module" src="js/log.js"></script>
  <script type="module" src="js/navigation.js"></script>
</body>
</html>
