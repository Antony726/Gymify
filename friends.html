<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👥 Social Hub - Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    /* Tabs */
    .social-tabs {
      display: flex;
      gap: 4px;
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 5px;
      margin-bottom: 18px;
    }
    .social-tab {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      box-shadow: none;
      transition: all 0.25s ease;
      position: relative;
    }
    .social-tab:hover {
      color: #fff;
      background: rgba(255,255,255,0.04);
      transform: none;
      box-shadow: none;
    }
    .social-tab.active {
      background: rgba(6, 182, 212, 0.12);
      color: var(--color-accent);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.1);
    }
    .tab-badge {
      position: absolute;
      top: 4px;
      right: 10px;
      background: var(--color-danger);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 8px;
      min-width: 16px;
      display: none;
    }
    .tab-badge.show { display: inline-block; }

    /* Tab Panes */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadePane 0.25s ease; }
    @keyframes fadePane {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Section Headers */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .section-head h3 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-head .count-pill {
      font-size: 11px;
      background: rgba(6, 182, 212, 0.12);
      color: var(--color-accent);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
    }

    /* Friend Card */
    .friend-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .friend-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(6, 182, 212, 0.15);
      transform: translateY(-1px);
    }
    .friend-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      background: rgba(255,255,255,0.03);
    }
    .friend-info { flex: 1; min-width: 0; }
    .friend-name {
      font-weight: 700;
      color: #fff;
      font-size: 14px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .friend-stats {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      gap: 10px;
    }
    .friend-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .btn-sm {
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 8px;
      font-weight: 700;
    }
    .btn-accept {
      background: linear-gradient(135deg, var(--color-success) 0%, #059669 100%) !important;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2) !important;
    }
    .btn-reject {
      background: rgba(244, 63, 94, 0.1) !important;
      border: 1px solid rgba(244, 63, 94, 0.2) !important;
      color: var(--color-danger) !important;
      box-shadow: none !important;
    }
    .btn-add {
      background: rgba(6, 182, 212, 0.1) !important;
      border: 1px solid rgba(6, 182, 212, 0.2) !important;
      color: var(--color-accent) !important;
      box-shadow: none !important;
    }
    .btn-add:hover { background: rgba(6, 182, 212, 0.2) !important; }
    .btn-remove {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-secondary) !important;
      box-shadow: none !important;
    }

    /* Search */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .search-bar input {
      margin: 0;
      flex: 1;
    }
    .search-bar button {
      padding: 12px 16px;
      font-size: 13px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 30px 15px;
      color: var(--text-secondary);
    }
    .empty-icon {
      font-size: 36px;
      display: block;
      margin-bottom: 10px;
      opacity: 0.5;
    }
    .empty-state p {
      font-size: 13px;
      line-height: 1.5;
    }

    /* Pending Req card highlight */
    .friend-card.pending {
      border-color: rgba(245, 158, 11, 0.2);
      background: rgba(245, 158, 11, 0.03);
    }

    /* Chat Tab */
    .chat-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chat-list-item:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(6, 182, 212, 0.15);
    }
    .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      background: rgba(255,255,255,0.03);
    }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      margin-bottom: 2px;
    }
    .chat-preview {
      font-size: 11px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-arrow {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Full Page Loader */
    .page-loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    .page-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-icon {
      font-size: 48px;
      animation: pulseDumbbell 1.2s infinite alternate;
      margin-bottom: 15px;
    }
    .loader-text {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Full Page Loader -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-icon">👥</div>
    <div class="loader-text">Loading your squad...</div>
  </div>

  <div class="container" style="margin-top: 15px;">
    <h2 class="text-center glow-text" style="margin-bottom: 15px; font-size: 22px;">👥 Social Hub</h2>

    <!-- Tabs -->
    <div class="social-tabs">
      <button class="social-tab active" onclick="switchTab('friends', this)" id="tab-friends">
        🤝 Friends
      </button>
      <button class="social-tab" onclick="switchTab('discover', this)" id="tab-discover">
        🔍 Discover
        <span class="tab-badge" id="requestBadge">0</span>
      </button>
      <button class="social-tab" onclick="switchTab('chat', this)" id="tab-chat">
        💬 Chat
      </button>
    </div>

    <!-- Tab 1: Friends -->
    <div class="tab-pane active" id="pane-friends">
      <div class="section-head">
        <h3>✅ My Squad <span class="count-pill" id="friendCount">0</span></h3>
      </div>
      <div id="friendsList"></div>
    </div>

    <!-- Tab 2: Discover -->
    <div class="tab-pane" id="pane-discover">
      <!-- Search -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by username..." />
        <button id="searchBtn" class="btn">🔍</button>
      </div>
      <div id="searchResults"></div>

      <!-- Pending Requests -->
      <div class="section-head" style="margin-top: 15px;">
        <h3>📬 Requests <span class="count-pill" id="requestCount" style="display:none;">0</span></h3>
      </div>
      <div id="pendingRequests"></div>

      <!-- Suggested -->
      <div class="section-head" style="margin-top: 15px;">
        <h3>💡 Suggested</h3>
      </div>
      <div id="suggestedUsers"></div>
    </div>

    <!-- Tab 3: Chat -->
    <div class="tab-pane" id="pane-chat">
      <div class="section-head">
        <h3>💬 Conversations</h3>
      </div>
      <div id="chatList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      setDoc,
      getDocs,
      query,
      where,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    const pageLoader = document.getElementById("pageLoader");

    function hideLoader() {
      if (pageLoader) {
        pageLoader.classList.add("hidden");
        setTimeout(() => { pageLoader.style.display = "none"; }, 300);
      }
    }

    function showStatus(message, type) {
      if (window.showToast) {
        window.showToast(message, type);
      } else {
        alert(message);
      }
    }

    // Tab switching
    window.switchTab = function(tabName, tabEl) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.social-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`pane-${tabName}`).classList.add('active');
      tabEl.classList.add('active');
    };

    // Helper: get username
    async function getUsername(userId) {
      try {
        try {
          const lbRef = doc(db, "leaderboard", userId);
          const lbSnap = await getDoc(lbRef);
          if (lbSnap.exists() && lbSnap.data()?.username) return lbSnap.data().username;
        } catch (e) {}
        try {
          const profileRef = doc(db, "users", userId, "data", "profile");
          const profileSnap = await getDoc(profileRef);
          if (profileSnap.exists() && profileSnap.data()?.username) return profileSnap.data().username;
        } catch (e) {}
        const userRef = doc(db, "users", userId);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
          const d = userSnap.data();
          if (d.displayName) return d.displayName;
          if (d.email) return d.email.split("@")[0];
        }
        return `User-${userId.substring(0, 6)}`;
      } catch (err) {
        return `User-${userId.substring(0, 6)}`;
      }
    }

    // Helper: get avatar
    async function getAvatar(userId) {
      try {
        const profileRef = doc(db, "users", userId, "data", "profile");
        const snap = await getDoc(profileRef);
        if (snap.exists() && snap.data()?.avatar) {
          return `assets/avatars/${snap.data().avatar}`;
        }
      } catch (e) {}
      return "assets/avatars/avatar1.jpg";
    }

    // ===== Friends List =====
    async function loadFriends() {
      const friendsDiv = document.getElementById('friendsList');
      try {
        const friendsRef = collection(db, "users", currentUser.uid, "friends");
        const snapshot = await getDocs(friendsRef);

        if (snapshot.empty) {
          friendsDiv.innerHTML = `
            <div class="empty-state">
              <span class="empty-icon">🤝</span>
              <p>No friends yet.<br>Switch to <strong>Discover</strong> to find workout buddies!</p>
            </div>`;
          document.getElementById('friendCount').textContent = '0';
          return;
        }

        document.getElementById('friendCount').textContent = snapshot.size;
        const friendsData = [];

        for (const friendDoc of snapshot.docs) {
          const fd = friendDoc.data();
          const friendId = fd.friendId;
          let username = fd.username || "Unknown";
          if (username === "Unknown") {
            username = await getUsername(friendId);
            try {
              await setDoc(doc(db, "users", currentUser.uid, "friends", friendId), { ...fd, username }, { merge: true });
            } catch (e) {}
          }
          const statsRef = doc(db, "users", friendId, "data", "stats");
          const statsSnap = await getDoc(statsRef);
          const avatar = await getAvatar(friendId);

          friendsData.push({
            friendId,
            username,
            avatar,
            xp: statsSnap.exists() ? statsSnap.data().xp || 0 : 0,
            streak: statsSnap.exists() ? statsSnap.data().streak || 0 : 0
          });
        }

        friendsDiv.innerHTML = friendsData.map(f => `
          <div class="friend-card" onclick="viewFriend('${f.friendId}')">
            <img src="${f.avatar}" alt="" class="friend-avatar">
            <div class="friend-info">
              <div class="friend-name">${f.username}</div>
              <div class="friend-stats">
                <span>⭐ ${f.xp} XP</span>
                <span>🔥 ${f.streak} day streak</span>
              </div>
            </div>
            <div class="friend-actions">
              <button class="btn btn-sm btn-remove" onclick="event.stopPropagation(); removeFriend('${f.friendId}', '${f.username}')">✕</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error loading friends:", err);
      }
    }

    // ===== Chat List (all friends → link to friend-profile chat) =====
    async function loadChatList() {
      const chatListDiv = document.getElementById('chatList');
      try {
        const friendsRef = collection(db, "users", currentUser.uid, "friends");
        const snapshot = await getDocs(friendsRef);

        if (snapshot.empty) {
          chatListDiv.innerHTML = `
            <div class="empty-state">
              <span class="empty-icon">💬</span>
              <p>No conversations yet.<br>Add friends first to start chatting!</p>
            </div>`;
          return;
        }

        const items = [];
        for (const friendDoc of snapshot.docs) {
          const fd = friendDoc.data();
          const friendId = fd.friendId;
          let username = fd.username || await getUsername(friendId);
          const avatar = await getAvatar(friendId);
          items.push({ friendId, username, avatar });
        }

        chatListDiv.innerHTML = items.map(f => `
          <div class="chat-list-item" onclick="viewFriend('${f.friendId}')">
            <img src="${f.avatar}" alt="" class="chat-avatar">
            <div class="chat-info">
              <div class="chat-name">${f.username}</div>
              <div class="chat-preview">Tap to open chat →</div>
            </div>
            <span class="chat-arrow">›</span>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error loading chat list:", err);
        chatListDiv.innerHTML = `<div class="empty-state"><p>Failed to load chats.</p></div>`;
      }
    }

    // ===== Search =====
    document.getElementById('searchBtn').addEventListener('click', async () => {
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!searchTerm) return showStatus('Please enter a search term', 'warning');

      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = '<div class="empty-state"><p>🔍 Searching...</p></div>';

      try {
        // Get current friend IDs to avoid showing "Add" for existing friends
        const friendsRef = collection(db, "users", currentUser.uid, "friends");
        const friendsSnap = await getDocs(friendsRef);
        const friendIds = new Set(friendsSnap.docs.map(d => d.data().friendId));

        // Get pending sent requests to avoid duplicates
        const sentReqRef = collection(db, "friendRequests");
        const sentQ = query(sentReqRef, where("from", "==", currentUser.uid), where("status", "==", "pending"));
        const sentSnap = await getDocs(sentQ);
        const sentIds = new Set(sentSnap.docs.map(d => d.data().to));

        const leaderboardRef = collection(db, "leaderboard");
        const snapshot = await getDocs(leaderboardRef);
        const results = [];

        snapshot.forEach(docSnap => {
          const userId = docSnap.id;
          const username = docSnap.data().username || "";
          const xp = docSnap.data().xp || 0;
          if (userId === currentUser.uid) return;
          if (username.toLowerCase().includes(searchTerm)) {
            results.push({ userId, username, xp, isFriend: friendIds.has(userId), isPending: sentIds.has(userId) });
          }
        });

        // Fallback to users collection
        if (results.length === 0) {
          const usersRef = collection(db, "users");
          const usersSnapshot = await getDocs(usersRef);
          for (const userDoc of usersSnapshot.docs) {
            const userId = userDoc.id;
            if (userId === currentUser.uid) continue;
            const username = await getUsername(userId);
            const statsRef = doc(db, "users", userId, "data", "stats");
            const statsSnap = await getDoc(statsRef);
            const xp = statsSnap.exists() ? statsSnap.data().xp || 0 : 0;
            if (username.toLowerCase().includes(searchTerm)) {
              results.push({ userId, username, xp, isFriend: friendIds.has(userId), isPending: sentIds.has(userId) });
            }
          }
        }

        if (results.length === 0) {
          resultsDiv.innerHTML = '<div class="empty-state"><p>No users found matching that name.</p></div>';
          return;
        }

        resultsDiv.innerHTML = results.map(user => {
          let actionBtn = '';
          if (user.isFriend) {
            actionBtn = `<span style="font-size:11px; color:var(--color-success); font-weight:700;">✅ Friends</span>`;
          } else if (user.isPending) {
            actionBtn = `<span style="font-size:11px; color:var(--color-warning); font-weight:700;">⏳ Sent</span>`;
          } else {
            actionBtn = `<button class="btn btn-sm btn-add" onclick="event.stopPropagation(); sendFriendRequest('${user.userId}', '${user.username}')">+ Add</button>`;
          }
          return `
            <div class="friend-card" style="cursor:default;">
              <div class="friend-info">
                <div class="friend-name">${user.username}</div>
                <div class="friend-stats"><span>⭐ ${user.xp} XP</span></div>
              </div>
              <div class="friend-actions">${actionBtn}</div>
            </div>`;
        }).join('');
      } catch (err) {
        console.error(err);
        showStatus('Error searching users', 'error');
      }
    });

    // Search on Enter key
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    // ===== Send Friend Request =====
    window.sendFriendRequest = async (friendId, friendName) => {
      try {
        // Check if request already exists (prevent duplicates)
        const reqRef = collection(db, "friendRequests");
        const existQ = query(reqRef, where("from", "==", currentUser.uid), where("to", "==", friendId), where("status", "==", "pending"));
        const existSnap = await getDocs(existQ);
        if (!existSnap.empty) {
          showStatus(`Request to ${friendName} already sent!`, 'warning');
          return;
        }

        const myUsername = await getUsername(currentUser.uid);
        const requestRef = doc(collection(db, "friendRequests"));
        await setDoc(requestRef, {
          from: currentUser.uid,
          to: friendId,
          fromName: myUsername,
          toName: friendName,
          status: "pending",
          timestamp: new Date().toISOString()
        });
        showStatus(`Request sent to ${friendName}!`, 'success');
        // Reload search to update button states
        document.getElementById('searchBtn').click();
      } catch (err) {
        console.error(err);
        showStatus('Error sending friend request', 'error');
      }
    };

    // ===== Pending Requests =====
    async function loadPendingRequests() {
      const requestsDiv = document.getElementById('pendingRequests');
      try {
        const requestsRef = collection(db, "friendRequests");
        const q = query(requestsRef, where("to", "==", currentUser.uid), where("status", "==", "pending"));
        const snapshot = await getDocs(q);

        const reqBadge = document.getElementById('requestBadge');
        const reqCount = document.getElementById('requestCount');

        if (snapshot.empty) {
          requestsDiv.innerHTML = '<div class="empty-state"><p>No pending requests</p></div>';
          reqBadge.classList.remove('show');
          reqCount.style.display = 'none';
          return;
        }

        reqBadge.textContent = snapshot.size;
        reqBadge.classList.add('show');
        reqCount.textContent = snapshot.size;
        reqCount.style.display = 'inline-block';

        requestsDiv.innerHTML = snapshot.docs.map(docSnap => {
          const data = docSnap.data();
          return `
            <div class="friend-card pending">
              <div class="friend-info">
                <div class="friend-name">${data.fromName}</div>
                <div class="friend-stats"><span>Wants to be your gym buddy</span></div>
              </div>
              <div class="friend-actions">
                <button class="btn btn-sm btn-accept" onclick="acceptRequest('${docSnap.id}', '${data.from}')">✓</button>
                <button class="btn btn-sm btn-reject" onclick="rejectRequest('${docSnap.id}')">✕</button>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    // ===== Accept / Reject =====
    window.acceptRequest = async (requestId, friendId) => {
      try {
        const friendUsername = await getUsername(friendId);
        const myUsername = await getUsername(currentUser.uid);

        const friendStatsRef = doc(db, "users", friendId, "data", "stats");
        const friendStatsSnap = await getDoc(friendStatsRef);
        const friendXP = friendStatsSnap.exists() ? friendStatsSnap.data().xp || 0 : 0;
        const friendStreak = friendStatsSnap.exists() ? friendStatsSnap.data().streak || 0 : 0;

        const myStatsRef = doc(db, "users", currentUser.uid, "data", "stats");
        const myStatsSnap = await getDoc(myStatsRef);
        const myXP = myStatsSnap.exists() ? myStatsSnap.data().xp || 0 : 0;
        const myStreak = myStatsSnap.exists() ? myStatsSnap.data().streak || 0 : 0;

        await setDoc(doc(db, "users", currentUser.uid, "friends", friendId), {
          friendId, username: friendUsername, xp: friendXP, streak: friendStreak, addedAt: new Date().toISOString()
        });
        await setDoc(doc(db, "users", friendId, "friends", currentUser.uid), {
          friendId: currentUser.uid, username: myUsername, xp: myXP, streak: myStreak, addedAt: new Date().toISOString()
        });
        await deleteDoc(doc(db, "friendRequests", requestId));

        showStatus(`You and ${friendUsername} are friends!`, 'success');
        loadPendingRequests();
        loadFriends();
        loadSuggestedUsers();
        loadChatList();
      } catch (err) {
        console.error(err);
        showStatus('Error accepting request', 'error');
      }
    };

    window.rejectRequest = async (requestId) => {
      try {
        await deleteDoc(doc(db, "friendRequests", requestId));
        showStatus('Request rejected', 'success');
        loadPendingRequests();
      } catch (err) {
        console.error(err);
        showStatus('Error rejecting request', 'error');
      }
    };

    // ===== Remove Friend =====
    window.removeFriend = async (friendId, friendName) => {
      if (!confirm(`Remove ${friendName} from friends?`)) return;
      try {
        await deleteDoc(doc(db, "users", currentUser.uid, "friends", friendId));
        try {
          await deleteDoc(doc(db, "users", friendId, "friends", currentUser.uid));
        } catch (e) {}
        showStatus('Friend removed', 'success');
        loadFriends();
        loadSuggestedUsers();
        loadChatList();
      } catch (err) {
        console.error(err);
        showStatus('Error removing friend', 'error');
      }
    };

    // ===== View Friend Profile =====
    window.viewFriend = (friendId) => {
      window.location.href = `friend-profile.html?id=${friendId}`;
    };

    // ===== Suggested Users =====
    async function loadSuggestedUsers() {
      const suggestedDiv = document.getElementById('suggestedUsers');
      try {
        const friendsRef = collection(db, "users", currentUser.uid, "friends");
        const friendsSnap = await getDocs(friendsRef);
        const friendIds = new Set(friendsSnap.docs.map(d => d.data().friendId));

        const leaderboardRef = collection(db, "leaderboard");
        const snapshot = await getDocs(leaderboardRef);

        const suggestions = [];
        snapshot.forEach(docSnap => {
          const userId = docSnap.id;
          if (userId === currentUser.uid || friendIds.has(userId)) return;
          suggestions.push({
            userId,
            username: docSnap.data().username || "User",
            xp: docSnap.data().xp || 0,
            streak: docSnap.data().streak || 0
          });
        });

        suggestions.sort((a, b) => b.xp - a.xp);
        const top = suggestions.slice(0, 5);

        if (top.length === 0) {
          suggestedDiv.innerHTML = '<div class="empty-state"><p>No suggestions available.</p></div>';
          return;
        }

        suggestedDiv.innerHTML = top.map(user => `
          <div class="friend-card" style="cursor:default;">
            <div class="friend-info">
              <div class="friend-name">${user.username}</div>
              <div class="friend-stats">
                <span>⭐ ${user.xp} XP</span>
                <span>🔥 ${user.streak} streak</span>
              </div>
            </div>
            <div class="friend-actions">
              <button class="btn btn-sm btn-add" onclick="sendFriendRequest('${user.userId}', '${user.username}')">+ Add</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        suggestedDiv.innerHTML = '<div class="empty-state"><p>Failed to load suggestions</p></div>';
      }
    }

    // ===== Init =====
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;

      // Load all data in parallel
      await Promise.all([
        loadFriends(),
        loadPendingRequests(),
        loadSuggestedUsers(),
        loadChatList()
      ]);

      hideLoader();
    });
  </script>
  <script type="module" src="js/navigation.js"></script>
</body>
</html>
