<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 Gym Excuse Eliminator | Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .response-box {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-warning);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: pre-wrap;
      border: 1px dashed rgba(245, 158, 11, 0.2);
      background: rgba(245, 158, 11, 0.03);
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .reaction {
      position: absolute;
      font-size: 2rem;
      animation: floatUp 1.5s ease-out forwards;
      pointer-events: none;
      z-index: 10000;
    }
    @keyframes floatUp {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-100px) scale(1.4); }
    }
  </style>
</head>
<body>
  <div class="container" style="margin-top: 20px;">
    <h2 class="text-center glow-text" style="margin-bottom: 25px;">💬 Excuse Eliminator</h2>

    <div class="glass-card text-center">
      <p style="color: var(--text-secondary); margin-bottom: 15px;">Type your excuse below... if you dare 😈</p>
      
      <textarea id="excuseInput" placeholder="I don’t feel like going today because..." style="height: 100px; resize: none; margin-bottom: 15px;"></textarea>
      
      <button id="submitExcuse" class="btn" style="width: 100%; background: linear-gradient(135deg, var(--color-danger) 0%, #be123c 100%); box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);">Roast Me 🔥</button>
      
      <div class="response-box" id="response">Your roast will appear here. No excuses!</div>
    </div>

    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" style="width: 100%; margin-top: 10px;">⬅ Back to Dashboard</button>
  </div>

  <script type="module" src="js/navigation.js"></script>
  <script>
    const responses = [
      "You don’t feel like it? Neither did The Rock, and now look at him.",
      "Your couch called — it said it’s tired of seeing you.",
      "Excuses burn zero calories. Try again.",
      "Bro, even your water bottle is judging you right now 💧",
      "The barbell is waiting. Don’t make it sad 😢",
      "Your muscles just texted: ‘We feel neglected.’",
      "You said the same thing yesterday. Guess what? Still small 💀",
      "The gym misses you more than your crush does ❤️",
      "Do it for the mirror selfie you’ll post later 📸",
      "Every rep you skip, a gym bro loses his pump. Think about that.",
      "Your pre-workout cried itself to sleep waiting for you ☕️",
      "The treadmill just rolled its eyes when it heard your excuse.",
      "You’re one excuse away from becoming a potato 🥔",
      "Even your playlist is disappointed you didn’t show up 🎧",
      "If laziness was a sport, you’d have a gold medal by now 🥇",
      "Your gains filed a missing persons report 📉",
      "That protein shake in the fridge isn’t for decoration, bro.",
      "You can’t flex excuses, only muscles 💪",
      "Skipping one day is how legends become myths 👻",
      "You said you’ll start tomorrow… again. How many tomorrows you got left?",
      "Your mirror unfollowed you for inactivity.",
      "Every skipped workout adds one extra burpee to your next session 😈",
      "That soreness? It’s your muscles begging you to keep going.",
      "Your gym shoes are developing abandonment issues 👟",
      "You’ve got more excuses than sets completed.",
      "Somewhere out there, someone just out-benched you while you scroll reels 📱",
      "If ‘rest day’ had a face, it would look confused right now 😵‍💫",
      "You’re not tired — your motivation just fell asleep.",
      "Even ChatGPT can’t make gains for you. Go lift.",
      "Remember: Sweat dries. Regret doesn’t.",
      "You skipped gym so hard, your dumbbells applied for unemployment 🏋️‍♂️",
      "Your biceps called. They said they’re shrinking in fear.",
      "If you’re not lifting, your brain’s just lifting excuses.",
      "Skipping leg day is one thing. Skipping EVERY day? That’s talent 😭",
      "You’re turning ‘gym rat’ into ‘gym ghost’ 👻",
      "You’ll feel more pain from guilt than from squats.",
      "Even Siri said, ‘Go to gym, lazy human.’"
    ];

    const typingSound = new Audio("https://actions.google.com/sounds/v1/office/typewriter.ogg");
    const burnSound = new Audio("https://actions.google.com/sounds/v1/human_voices/male_crowd_cheer.ogg");

    const responseDiv = document.getElementById("response");
    const button = document.getElementById("submitExcuse");

    button.addEventListener("click", () => {
      const excuse = document.getElementById("excuseInput").value.trim();
      if (!excuse) {
        if (window.showToast) {
          window.showToast("⚠️ C'mon, at least give me an excuse to roast!", "warning");
        } else {
          alert("C'mon, at least give me an excuse to roast!");
        }
        return;
      }

      responseDiv.textContent = "Thinking...";
      button.disabled = true;

      setTimeout(() => {
        const roast = responses[Math.floor(Math.random() * responses.length)];
        typeRoast(roast);
      }, 1000);
    });

    function typeRoast(text) {
      responseDiv.textContent = "";
      typingSound.currentTime = 0;
      typingSound.play().catch(() => {}); // catch autoplay policy blocks

      let i = 0;
      const interval = setInterval(() => {
        if (i < text.length) {
          responseDiv.textContent += text[i];
          i++;
        } else {
          clearInterval(interval);
          typingSound.pause();
          burnSound.play().catch(() => {});
          showRandomReactions();
          button.disabled = false;
        }
      }, 40);
    }

    function showRandomReactions() {
      const emojis = ["🔥", "💀", "😂", "💪", "😤"];
      for (let i = 0; i < 4; i++) {
        const emoji = document.createElement("div");
        emoji.className = "reaction";
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        // Position relative to response box
        const rect = responseDiv.getBoundingClientRect();
        emoji.style.left = `${rect.left + (Math.random() * rect.width)}px`;
        emoji.style.top = `${rect.top}px`;
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }
    }
  </script>
</body>
</html>
