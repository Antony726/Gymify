<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Feedback | Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="config.js"></script> <!-- 🔒 Your hidden keys -->
</head>
<body>
  <div class="container" style="margin-top: 20px; padding-bottom: 90px;">
    <h2 class="text-center glow-text" style="margin-bottom: 25px;">💪 Help Improve Gymify</h2>
    
    <div class="glass-card">
      <p style="font-style: italic; color: var(--text-secondary); line-height: 1.5; font-size: 14px; text-align: center; margin-bottom: 20px;">
        "Your feedback helps make Gymify a smoother and stronger experience for everyone."
      </p>

      <form id="feedback-form">
        <div style="margin-bottom: 15px;">
          <label for="name">👤 Your Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />
        </div>

        <div style="margin-bottom: 15px;">
          <label for="email">📧 Your Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div style="margin-bottom: 15px;">
          <label for="type">📌 Feedback Type</label>
          <select id="type" required style="margin-top: 8px;">
            <option value="">Select...</option>
            <option value="Feature Request">Feature Request</option>
            <option value="Bug Report">Bug Report</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div style="margin-bottom: 15px;">
          <label for="details">📝 Detailed Description</label>
          <textarea id="details" placeholder="Describe your feedback..." required style="height: 120px; resize: vertical; margin-top: 8px;"></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">🚀 Submit Feedback</button>
      </form>
    </div>

    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" style="width: 100%; margin-top: 10px;">⬅ Back to Dashboard</button>
  </div>

  <script type="module" src="js/navigation.js"></script>
  <script>
    // ✅ Initialize EmailJS with hidden config
    document.addEventListener("DOMContentLoaded", function() {
      if (window.EMAIL_CONFIG && window.EMAIL_CONFIG.PUBLIC_KEY) {
        emailjs.init(window.EMAIL_CONFIG.PUBLIC_KEY);
      } else {
        console.warn("⚠️ EmailJS public key is not configured.");
      }

      const form = document.getElementById("feedback-form");

      form.addEventListener("submit", function(e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const type = document.getElementById("type").value;
        const message = document.getElementById("details").value.trim();

        const templateParams = {
          user_name: name,
          user_email: email,
          feedback_type: type,
          feedback_message: message,
          time: new Date().toLocaleString()
        };

        if (!window.EMAIL_CONFIG || !window.EMAIL_CONFIG.SERVICE_ID || !window.EMAIL_CONFIG.TEMPLATE_ID) {
          if (window.showToast) {
            window.showToast("⚠️ API config not found. Simulating success!", "warning");
          }
          form.reset();
          return;
        }

        emailjs.send(window.EMAIL_CONFIG.SERVICE_ID, window.EMAIL_CONFIG.TEMPLATE_ID, templateParams)
          .then(() => {
            if (window.showToast) {
              window.showToast("✅ Thank you! Feedback sent successfully.", "success");
            }
            form.reset();
          })
          .catch((error) => {
            console.error("Error sending feedback:", error);
            if (window.showToast) {
              window.showToast("❌ Failed to send feedback. Try again.", "error");
            }
          });
      });
    });
  </script>
</body>
</html>
