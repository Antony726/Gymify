<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏆 Leaderboard - Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--color-accent) 0%, #0891b2 100%);
      color: #fff;
      border-color: var(--color-accent);
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.2);
    }
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin: 25px 0;
      gap: 15px;
    }
    .podium-place {
      text-align: center;
      flex: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 15px 10px;
      position: relative;
    }
    .podium-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      background: var(--bg-primary);
      border: 2px solid var(--border-color);
    }
    .place-1 {
      transform: translateY(-12px);
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.3);
      box-shadow: 0 10px 30px rgba(251, 191, 36, 0.1);
    }
    .place-1 .podium-avatar {
      border-color: #fbbf24;
      background: #fbbf24;
      color: #000;
      width: 62px;
      height: 62px;
      font-size: 24px;
    }
    .place-2 {
      background: rgba(226, 232, 240, 0.05);
      border-color: rgba(226, 232, 240, 0.2);
    }
    .place-2 .podium-avatar {
      border-color: #cbd5e1;
      background: #cbd5e1;
      color: #000;
    }
    .place-3 {
      background: rgba(249, 115, 22, 0.05);
      border-color: rgba(249, 115, 22, 0.2);
    }
    .place-3 .podium-avatar {
      border-color: #f97316;
      background: #f97316;
      color: #000;
    }
    .podium-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .podium-stats {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .podium-rank {
      font-size: 18px;
      margin-bottom: 5px;
    }
    .rank-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.2s ease;
    }
    .rank-card.current-user {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.1);
    }
    .rank-number {
      font-size: 16px;
      font-weight: 800;
      color: var(--color-accent);
      min-width: 30px;
    }
    .rank-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      border: 1px solid var(--border-color);
    }
    .rank-info {
      flex: 1;
    }
    .rank-name {
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .rank-stats {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .you-badge {
      background: var(--color-accent);
      color: #000;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
    }
    .loading {
      text-align: center;
      color: var(--text-secondary);
      padding: 30px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center glow-text" style="margin-top: 15px; margin-bottom: 15px;">🏆 Leaderboard</h2>

    <div class="tabs">
      <div class="tab active" data-tab="global">🌍 Global</div>
      <div class="tab" data-tab="friends">👥 Friends</div>
    </div>

    <!-- Top 3 Podium -->
    <div class="podium" id="podium" style="display: none;">
      <div class="podium-place place-2" id="place2"></div>
      <div class="podium-place place-1" id="place1"></div>
      <div class="podium-place place-3" id="place3"></div>
    </div>

    <!-- Leaderboard list -->
    <div class="section" style="padding: 15px;">
      <div id="leaderboard">
        <div class="loading">Loading leaderboard...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc,
      getDocs,
      query,
      orderBy,
      limit,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentTab = 'global';

    async function updateLeaderboardEntry(userId) {
      try {
        const profileRef = doc(db, "users", userId, "data", "profile");
        const profileSnap = await getDoc(profileRef);
        const statsRef = doc(db, "users", userId, "data", "stats");
        const statsSnap = await getDoc(statsRef);
        
        if (!statsSnap.exists()) return;
        
        const username = profileSnap.exists() 
          ? profileSnap.data().username 
          : auth.currentUser?.displayName || auth.currentUser?.email || "Anonymous";
        
        const xp = statsSnap.data().xp || 0;
        const streak = statsSnap.data().streak || 0;
        
        await setDoc(doc(db, "leaderboard", userId), {
          username,
          xp,
          streak,
          updatedAt: new Date().toISOString()
        });
      } catch (err) {
        console.error("Error updating leaderboard:", err);
      }
    }

    async function loadGlobalLeaderboard() {
      const leaderboardDiv = document.getElementById('leaderboard');
      leaderboardDiv.innerHTML = '<div class="loading">Loading Global warriors...</div>';

      try {
        const leaderboardRef = collection(db, "leaderboard");
        const q = query(leaderboardRef, orderBy("xp", "desc"), limit(100));
        const snapshot = await getDocs(q);

        const users = [];
        snapshot.forEach(doc => {
          users.push({
            id: doc.id,
            username: doc.data().username || "Anonymous",
            xp: doc.data().xp || 0,
            streak: doc.data().streak || 0
          });
        });

        if (!users.some(u => u.id === currentUser.uid)) {
          const statsRef = doc(db, "users", currentUser.uid, "data", "stats");
          const statsSnap = await getDoc(statsRef);
          const profileRef = doc(db, "users", currentUser.uid, "data", "profile");
          const profileSnap = await getDoc(profileRef);
          
          if (statsSnap.exists()) {
            users.push({
              id: currentUser.uid,
              username: profileSnap.exists() ? profileSnap.data().username : "You",
              xp: statsSnap.data().xp || 0,
              streak: statsSnap.data().streak || 0
            });
            await updateLeaderboardEntry(currentUser.uid);
          }
        }

        users.sort((a, b) => b.xp - a.xp);
        renderLeaderboard(users);
      } catch (err) {
        console.error(err);
        leaderboardDiv.innerHTML = '<div class="loading" style="color:var(--color-danger);">Failed to load global leaderboard</div>';
      }
    }

    async function loadFriendsLeaderboard() {
      const leaderboardDiv = document.getElementById('leaderboard');
      leaderboardDiv.innerHTML = '<div class="loading">Loading friends ranking...</div>';

      try {
        const friendsRef = collection(db, "users", currentUser.uid, "friends");
        const snapshot = await getDocs(friendsRef);

        if (snapshot.empty) {
          leaderboardDiv.innerHTML = `
            <div class="text-center" style="padding: 30px 10px; color: var(--text-secondary);">
              <p>You have no friends added yet.</p>
              <p style="font-size: 12px; margin-top: 4px;">Add friends under Social to see their ranking.</p>
            </div>
          `;
          document.getElementById('podium').style.display = 'none';
          return;
        }

        const users = [];
        for (const friendDoc of snapshot.docs) {
          const friendId = friendDoc.data().friendId;
          const profileRef = doc(db, "users", friendId, "data", "profile");
          const profileSnap = await getDoc(profileRef);
          const statsRef = doc(db, "users", friendId, "data", "stats");
          const statsSnap = await getDoc(statsRef);

          users.push({
            id: friendId,
            username: profileSnap.exists() ? profileSnap.data().username : "Unknown",
            xp: statsSnap.exists() ? statsSnap.data().xp || 0 : 0,
            streak: statsSnap.exists() ? statsSnap.data().streak || 0 : 0
          });
        }

        // Add current user
        const myStatsRef = doc(db, "users", currentUser.uid, "data", "stats");
        const myStatsSnap = await getDoc(myStatsRef);
        const myProfileRef = doc(db, "users", currentUser.uid, "data", "profile");
        const myProfileSnap = await getDoc(myProfileRef);

        users.push({
          id: currentUser.uid,
          username: myProfileSnap.exists() ? myProfileSnap.data().username : "You",
          xp: myStatsSnap.exists() ? myStatsSnap.data().xp || 0 : 0,
          streak: myStatsSnap.exists() ? myStatsSnap.data().streak || 0 : 0
        });

        users.sort((a, b) => b.xp - a.xp);
        renderLeaderboard(users);
      } catch (err) {
        console.error(err);
        leaderboardDiv.innerHTML = '<div class="loading" style="color:var(--color-danger);">Failed to load friends leaderboard</div>';
      }
    }

    function renderLeaderboard(users) {
      const leaderboardDiv = document.getElementById('leaderboard');

      if (users.length === 0) {
        leaderboardDiv.innerHTML = '<p class="loading">No users found.</p>';
        document.getElementById('podium').style.display = 'none';
        return;
      }

      if (users.length >= 3) {
        document.getElementById('podium').style.display = 'flex';
        renderPodium(users[0], users[1], users[2]);
      } else {
        document.getElementById('podium').style.display = 'none';
      }

      const startFrom = users.length >= 3 ? 3 : 0;
      
      const listHTML = users.slice(startFrom).map((user, i) => {
        const rank = startFrom + i + 1;
        const isCurrentUser = user.id === currentUser.uid;
        return `
          <div class="rank-card ${isCurrentUser ? 'current-user' : ''}">
            <div class="rank-number">#${rank}</div>
            <div class="rank-avatar">${user.username.charAt(0).toUpperCase()}</div>
            <div class="rank-info">
              <div class="rank-name">
                ${user.username}
                ${isCurrentUser ? '<span class="you-badge">YOU</span>' : ''}
              </div>
              <div class="rank-stats">⭐ ${user.xp} XP • 🔥 ${user.streak} streak</div>
            </div>
          </div>
        `;
      }).join('');

      if (listHTML === '' && users.length < 3) {
        leaderboardDiv.innerHTML = '<p class="loading">Podium displays all ranks.</p>';
      } else {
        leaderboardDiv.innerHTML = listHTML;
      }
    }

    function renderPodium(first, second, third) {
      document.getElementById('place1').innerHTML = `
        <div class="podium-rank">👑</div>
        <div class="podium-avatar">${first.username.charAt(0).toUpperCase()}</div>
        <div class="podium-name">${first.username}${first.id === currentUser.uid ? ' (You)' : ''}</div>
        <div class="podium-stats">⭐ ${first.xp} XP</div>
      `;

      document.getElementById('place2').innerHTML = `
        <div class="podium-rank">🥈</div>
        <div class="podium-avatar">${second.username.charAt(0).toUpperCase()}</div>
        <div class="podium-name">${second.username}${second.id === currentUser.uid ? ' (You)' : ''}</div>
        <div class="podium-stats">⭐ ${second.xp} XP</div>
      `;

      document.getElementById('place3').innerHTML = `
        <div class="podium-rank">🥉</div>
        <div class="podium-avatar">${third.username.charAt(0).toUpperCase()}</div>
        <div class="podium-name">${third.username}${third.id === currentUser.uid ? ' (You)' : ''}</div>
        <div class="podium-stats">⭐ ${third.xp} XP</div>
      `;
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        
        if (currentTab === 'global') {
          loadGlobalLeaderboard();
        } else {
          loadFriendsLeaderboard();
        }
      });
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      
      currentUser = user;
      await updateLeaderboardEntry(user.uid);
      loadGlobalLeaderboard();
    });
  </script>
  <script type="module" src="js/navigation.js"></script>
</body>
</html>
