<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Challenges | Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .challenge-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 14px;
      margin-top: 12px;
      position: relative;
    }
    .challenge-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(6, 182, 212, 0.15);
    }
    .challenge-card h4 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 5px;
    }
    .challenge-card p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .participants {
      font-size: 12px;
      color: var(--color-accent) !important;
      font-weight: 600;
    }
    .join-btn {
      width: auto;
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 13px;
    }
    .create-box input {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center glow-text" style="margin-top: 15px; margin-bottom: 15px;">🏆 Community Challenges</h2>

    <!-- Create New Challenge -->
    <div class="create-box card">
      <h3 style="font-size: 16px; margin-bottom: 15px; color: var(--color-accent);">Create a New Challenge</h3>
      
      <label for="title">Challenge Title</label>
      <input type="text" id="title" placeholder="e.g., Summer Shredding" />
      
      <label for="goal">Goal Description</label>
      <input type="text" id="goal" placeholder="e.g., Complete 5 workouts this week" />
      
      <label for="duration">Duration</label>
      <input type="text" id="duration" placeholder="e.g., 7 days" />
      
      <button id="create-btn" style="width: 100%;">➕ Create Challenge</button>
    </div>

    <!-- Display Challenges -->
    <div class="section" style="padding: 15px;">
      <h3 style="font-size: 16px; margin-bottom: 15px; color: var(--color-accent);">🔥 Ongoing Challenges</h3>
      <div id="challenges-list">
        <p class="text-center" style="color:var(--text-secondary); padding:20px;">Loading challenges...</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/community.js"></script>
  <script type="module" src="js/navigation.js"></script>
</body>
</html>
