<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community | Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .community-tabs {
      display: flex; gap: 4px; background: rgba(9,13,22,0.6);
      border: 1px solid var(--border-color); border-radius: 14px; padding: 4px; margin-bottom: 16px;
    }
    .community-tab {
      flex: 1; text-align: center; padding: 10px 6px; border-radius: 10px;
      font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-secondary);
      background: transparent; border: none;
    }
    .community-tab.active {
      background: rgba(6,182,212,0.12); color: var(--color-accent);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .feed-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; gap: 8px;
    }
    .feed-stat {
      font-size: 11px; color: var(--text-secondary); font-weight: 600;
    }
    .feed-filters {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .feed-filter-btn {
      font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 20px;
      border: 1px solid var(--border-color); background: transparent;
      color: var(--text-secondary); cursor: pointer;
    }
    .feed-filter-btn.active {
      background: rgba(6,182,212,0.12); color: var(--color-accent);
      border-color: rgba(6,182,212,0.3);
    }
    .feed-card {
      background: rgba(255,255,255,0.025); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    .feed-card-clickable { cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
    .feed-card-clickable:hover {
      border-color: rgba(6,182,212,0.25); transform: translateY(-1px);
    }
    .feed-card.pr-card { border-left: 3px solid #fbbf24; }
    .feed-card.plan-card { border-left: 3px solid var(--color-accent); }
    .feed-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .feed-avatar {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(6,182,212,0.2);
    }
    .feed-name { font-weight: 700; font-size: 14px; color: #fff; }
    .feed-time { font-size: 10px; color: var(--text-secondary); }
    .feed-message { font-size: 13px; line-height: 1.5; color: var(--text-primary); white-space: pre-wrap; }
    .feed-badge {
      display: inline-block; font-size: 9px; font-weight: 800; padding: 2px 8px;
      border-radius: 8px; margin-bottom: 6px; text-transform: uppercase;
    }
    .feed-badge.pr { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .feed-badge.plan { background: rgba(6,182,212,0.12); color: var(--color-accent); }
    .feed-badge.update { background: rgba(16,185,129,0.12); color: var(--color-success); }
    .community-feed-status { color: var(--text-secondary); padding: 20px; }
    .community-feed-error { color: var(--color-danger); }
    .share-box textarea { height: 70px; margin-bottom: 6px; }
    .char-count { font-size: 10px; color: var(--text-secondary); text-align: right; margin-bottom: 10px; }
    .challenge-mini {
      background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 14px; margin-bottom: 10px;
    }
    .challenge-mini-head {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .challenge-member-pill {
      font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 10px;
      background: rgba(6,182,212,0.1); color: var(--color-accent); white-space: nowrap;
    }
    .challenge-progress-label { font-size: 11px; color: var(--color-accent); margin: 6px 0 4px; font-weight: 600; }
    .progress-bar-wrap {
      height: 8px; background: rgba(255,255,255,0.06); border-radius: 8px; overflow: hidden; margin: 8px 0;
    }
    .progress-bar-fill {
      height: 100%; background: linear-gradient(90deg, var(--color-accent), var(--color-success));
      border-radius: 8px; transition: width 0.3s ease;
    }
    .community-tip {
      font-size: 11px; color: var(--text-secondary); margin-bottom: 12px;
      padding: 10px 12px; border-radius: 12px;
      background: rgba(6,182,212,0.06); border: 1px solid rgba(6,182,212,0.12);
    }
  </style>
</head>
<body>
  <div class="container" style="margin-top: 15px; padding-bottom: 90px;">
    <h2 class="text-center glow-text" style="margin-bottom: 12px;">🌐 Gymify Community</h2>

    <div class="community-tabs">
      <button class="community-tab active" data-tab="feed">📣 Feed</button>
      <button class="community-tab" data-tab="share">📤 Share</button>
      <button class="community-tab" data-tab="challenges">🏆 Challenges</button>
    </div>

    <div class="tab-pane active" id="pane-feed">
      <div class="feed-toolbar">
        <span class="feed-stat">
          <span id="live-feed-indicator" class="live-feed-indicator">Live</span>
          · <span id="feed-stat-count">0</span> posts
        </span>
        <button id="refresh-feed-btn" class="btn btn-sm btn-secondary" style="font-size:11px;" title="Reconnect feed">↻</button>
      </div>
      <div class="feed-filters" id="feed-filters">
        <button class="feed-filter-btn active" data-feed-filter="all">All</button>
        <button class="feed-filter-btn" data-feed-filter="pr">🏆 PRs</button>
        <button class="feed-filter-btn" data-feed-filter="plan">📋 Plans</button>
        <button class="feed-filter-btn" data-feed-filter="post">💬 Updates</button>
      </div>
      <div id="feed-list">
        <p class="text-center community-feed-status">Loading feed...</p>
      </div>
    </div>

    <div class="tab-pane" id="pane-share">
      <div class="glass-card share-box">
        <h3 style="font-size:14px;margin-bottom:10px;">📋 Share Your Workout Plan</h3>
        <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">Post your weekly split to the community. Others can copy the code from your feed post.</p>
        <button id="share-plan-btn" class="btn" style="width:100%;margin-bottom:16px;">📤 Share My Plan to Feed</button>

        <h3 style="font-size:14px;margin-bottom:10px;">💬 Post an Update</h3>
        <textarea id="share-message" maxlength="280" placeholder="Share a win, tip, or gym thought..."></textarea>
        <div class="char-count"><span id="share-char-count">0</span>/280</div>
        <button id="share-post-btn" class="btn btn-secondary" style="width:100%;">Post to Feed</button>
      </div>
    </div>

    <div class="tab-pane" id="pane-challenges">
      <p class="community-tip">💡 1v1 buddy challenges are in <a href="friends.html?tab=challenges" style="color:var(--color-accent);">Social → Challenges</a>. Join community goals below!</p>
      <div id="community-challenges-list"></div>
    </div>
  </div>

  <script type="module" src="js/community.js"></script>
  <script type="module" src="js/navigation.js"></script>
</body>
</html>
