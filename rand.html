<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎥 Random Gym Video | Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
</head>
<body>
  <div class="container" style="margin-top: 20px;">
    <h2 class="text-center glow-text" style="margin-bottom: 25px;">🎬 Gym Videos Picker</h2>

    <div class="glass-card text-center">
      <p style="color: var(--text-secondary); margin-bottom: 20px;">Get a random piece of gym motivation, tips, or fails directly inside Gymify!</p>
      
      <div style="text-align: left; margin-bottom: 20px;">
        <label for="category">Pick your vibe</label>
        <select id="category" style="margin-top: 8px;">
          <option value="motivation">💥 Pure Motivation</option>
          <option value="fails">🤣 Hilarious Fails</option>
          <option value="tips">🧠 Form & Training Tips</option>
          <option value="music">🎧 Workout Tracks</option>
        </select>
      </div>

      <button onclick="loadRandomVideo()" class="btn" style="width: 100%;">🎥 Generate Video</button>

      <div id="video-container" style="margin-top: 20px;"></div>
    </div>

    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" style="width: 100%; margin-top: 10px; margin-bottom: 20px;">⬅ Back to Dashboard</button>
  </div>

  <script type="module" src="js/navigation.js"></script>
  <script>
    const videos = {
      motivation: [
        "https://www.youtube.com/watch?v=Fp5A8CXyS_E",
        "https://www.youtube.com/watch?v=wnHW6o8WMas",
        "https://www.youtube.com/watch?v=WE50ZSVQeDs",
        "https://www.youtube.com/watch?v=dbjbnrNNM64",
      ],
      fails: [
        "https://www.youtube.com/watch?v=YaSDCVK74gk",
        "https://www.youtube.com/watch?v=OZYj_1mK42s",
        "https://www.youtube.com/watch?v=LSHZFSYCRM4",
        "https://www.youtube.com/watch?v=glDmiut0MlM",
      ],
      tips: [
        "https://www.youtube.com/watch?v=qpRGnTTcLpo",
        "https://www.youtube.com/watch?v=vD-dEl7R2Bg",
        "https://www.youtube.com/watch?v=mtX-B5gbgmM",
        "https://www.youtube.com/watch?v=9551ymfFXdA",
      ],
      music: [
        "https://www.youtube.com/watch?v=D2CKOIiabfg",
        "https://www.youtube.com/watch?v=i_gNQm-H7fQ",
      ]
    };

    function getYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function loadRandomVideo() {
      const category = document.getElementById("category").value;
      const selectedList = videos[category];
      const randomURL = selectedList[Math.floor(Math.random() * selectedList.length)];
      const videoId = getYouTubeId(randomURL);

      const container = document.getElementById("video-container");
      container.innerHTML = "";

      if (videoId) {
        container.innerHTML = `
          <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 14px; border: 1px solid var(--border-color); box-shadow: var(--shadow-premium);">
            <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <a href="${randomURL}" target="_blank" class="btn btn-secondary" style="width: 100%; margin-top: 15px; font-size: 13px; gap: 6px;">
            <span>🌐 Open in YouTube</span>
          </a>
        `;
      } else {
        container.innerHTML = `
          <a href="${randomURL}" target="_blank" class="btn" style="width: 100%; margin-top: 15px;">▶️ Watch Video</a>
        `;
      }
    }
  </script>
</body>
</html>
