<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muscle Heatmap | Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .body-card-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }
    @media (max-width: 480px) {
      .body-card-container {
        grid-template-columns: 1fr;
      }
    }
    .body-view {
      text-align: center;
      padding: 15px;
    }
    .body-view h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    svg {
      width: 100%;
      max-width: 200px;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.3));
    }
    .muscle {
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      stroke: #090d16;
      stroke-width: 1.5;
    }
    .muscle:hover {
      filter: brightness(1.2) saturate(1.2);
      stroke: #fff;
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <div class="container" style="margin-top: 20px; padding-bottom: 90px;">
    <h2 class="text-center glow-text" style="margin-bottom: 25px;">🗺️ Muscle Heatmap</h2>

    <!-- Color Legend -->
    <div class="glass-card" style="padding: 15px;">
      <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Color Legend</h3>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 12px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 14px; height: 14px; border-radius: 4px; background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.3);"></div>
          <span>Fresh (0-2d)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 14px; height: 14px; border-radius: 4px; background: #06b6d4; box-shadow: 0 0 6px rgba(6, 182, 212, 0.3);"></div>
          <span>Optimal (3-5d)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 14px; height: 14px; border-radius: 4px; background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.3);"></div>
          <span>Recovery (6-7d)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 14px; height: 14px; border-radius: 4px; background: #f43f5e; box-shadow: 0 0 6px rgba(244, 63, 94, 0.3);"></div>
          <span>Neglected (8d+)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; grid-column: span 2;">
          <div style="width: 14px; height: 14px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color);"></div>
          <span>Never Trained</span>
        </div>
      </div>
    </div>

    <!-- Stats Summary Row -->
    <div class="stats-row" id="statsSummary" style="grid-template-columns: repeat(3, 1fr); margin: 15px 0; display: grid; gap: 10px;">
      <div class="card text-center" style="background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.15); margin: 0; padding: 12px 6px;">
        <h4 style="font-size: 10px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px;">Trained</h4>
        <span id="trainedCount" style="font-size: 18px; font-weight: 800; color: var(--color-success);">-</span>
      </div>
      <div class="card text-center" style="background: rgba(6, 182, 212, 0.05); border-color: rgba(6, 182, 212, 0.15); margin: 0; padding: 12px 6px; overflow: hidden;">
        <h4 style="font-size: 10px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px;">Fav Muscle</h4>
        <span id="mostTrained" style="font-size: 12px; font-weight: 800; color: var(--color-accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">-</span>
      </div>
      <div class="card text-center" style="background: rgba(244, 63, 94, 0.05); border-color: rgba(244, 63, 94, 0.15); margin: 0; padding: 12px 6px;">
        <h4 style="font-size: 10px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px;">Neglected</h4>
        <span id="needsAttention" style="font-size: 18px; font-weight: 800; color: var(--color-danger);">-</span>
      </div>
    </div>

    <!-- Interactive Heatmap Panel -->
    <div class="glass-card body-card-container">
      <div class="body-view">
        <h3>Front View</h3>
        <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
          <!-- Head -->
          <circle cx="100" cy="25" r="20" fill="rgba(255,255,255,0.06)" stroke="var(--border-color)" stroke-width="1.5"/>
          <!-- Neck -->
          <rect x="92" y="40" width="16" height="15" fill="rgba(255,255,255,0.06)" stroke="var(--border-color)" stroke-width="1.5"/>
          <!-- Shoulders -->
          <ellipse id="shoulders" class="muscle" cx="70" cy="65" rx="20" ry="15" fill="rgba(255, 255, 255, 0.08)"/>
          <ellipse id="shouldersR" class="muscle" cx="130" cy="65" rx="20" ry="15" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Chest -->
          <ellipse id="chest" class="muscle" cx="100" cy="85" rx="35" ry="25" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Abs -->
          <rect id="abs" class="muscle" x="85" y="105" width="30" height="45" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Biceps -->
          <ellipse id="biceps" class="muscle" cx="55" cy="95" rx="12" ry="20" fill="rgba(255, 255, 255, 0.08)"/>
          <ellipse id="bicepsR" class="muscle" cx="145" cy="95" rx="12" ry="20" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Forearms -->
          <rect id="forearms" class="muscle" x="48" y="115" width="12" height="35" rx="6" fill="rgba(255, 255, 255, 0.08)"/>
          <rect id="forearmsR" class="muscle" x="140" y="115" width="12" height="35" rx="6" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Quads -->
          <rect id="quads" class="muscle" x="82" y="155" width="16" height="60" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
          <rect id="quadsR" class="muscle" x="102" y="155" width="16" height="60" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Calves -->
          <ellipse id="calves" class="muscle" cx="90" cy="235" rx="8" ry="25" fill="rgba(255, 255, 255, 0.08)"/>
          <ellipse id="calvesR" class="muscle" cx="110" cy="235" rx="8" ry="25" fill="rgba(255, 255, 255, 0.08)"/>
        </svg>
      </div>

      <div class="body-view">
        <h3>Back View</h3>
        <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
          <!-- Head -->
          <circle cx="100" cy="25" r="20" fill="rgba(255,255,255,0.06)" stroke="var(--border-color)" stroke-width="1.5"/>
          <!-- Neck -->
          <rect x="92" y="40" width="16" height="15" fill="rgba(255,255,255,0.06)" stroke="var(--border-color)" stroke-width="1.5"/>
          <!-- Traps -->
          <path id="traps" class="muscle" d="M 75 55 Q 100 60 125 55 L 120 75 Q 100 80 80 75 Z" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Upper Back -->
          <rect id="upperback" class="muscle" x="75" y="75" width="50" height="30" rx="10" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Lower Back -->
          <rect id="lowerback" class="muscle" x="80" y="105" width="40" height="35" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Triceps -->
          <ellipse id="triceps" class="muscle" cx="55" cy="95" rx="12" ry="22" fill="rgba(255, 255, 255, 0.08)"/>
          <ellipse id="tricepsR" class="muscle" cx="145" cy="95" rx="12" ry="22" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Glutes -->
          <ellipse id="glutes" class="muscle" cx="100" cy="150" rx="30" ry="20" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Hamstrings -->
          <rect id="hamstrings" class="muscle" x="82" y="165" width="16" height="50" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
          <rect id="hamstringsR" class="muscle" x="102" y="165" width="16" height="50" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
          <!-- Calves -->
          <ellipse id="calvesBack" class="muscle" cx="90" cy="235" rx="8" ry="25" fill="rgba(255, 255, 255, 0.08)"/>
          <ellipse id="calvesBackR" class="muscle" cx="110" cy="235" rx="8" ry="25" fill="rgba(255, 255, 255, 0.08)"/>
        </svg>
      </div>
    </div>

    <!-- Muscle Info Modal -->
    <div class="modal" id="muscleModal" style="transition: opacity 0.25s ease; opacity: 0;">
      <div class="modal-content" style="max-width: 340px; border-color: var(--color-accent); box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 15px;">
          <h3 id="muscleName" style="font-size: 18px; color: #fff; margin: 0;">-</h3>
          <span id="closeMuscleModal" style="cursor: pointer; font-size: 18px; color: var(--text-secondary); font-weight: bold; padding: 4px 8px;">✕</span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr; gap: 12px; text-align: left;">
          
          <div style="background: rgba(255,255,255,0.02); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;">Status</span>
            <span id="muscleStatus" style="font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase;">-</span>
          </div>
          
          <div style="background: rgba(255,255,255,0.02); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;">Last Trained</span>
            <span id="lastTrained" style="font-size: 14px; color: #fff; font-weight: 600;">-</span>
          </div>
          
          <div style="background: rgba(255,255,255,0.02); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;">Days Since</span>
            <span id="daysSince" style="font-size: 14px; color: #fff; font-weight: 600;">-</span>
          </div>
          
          <div style="background: rgba(255,255,255,0.02); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;">Total Workouts</span>
            <span id="totalWorkouts" style="font-size: 14px; color: #fff; font-weight: 600;">-</span>
          </div>
          
        </div>
        <button id="modalOkBtn" class="btn" style="width: 100%; margin-top: 20px; font-size: 14px; padding: 12px;">Awesome</button>
      </div>
    </div>
 
    <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">⬅ Back to Dashboard</button>
  </div>

  <script type="module" src="js/navigation.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const muscleMap = {
      chest: "Chest",
      shoulders: "Left Shoulder",
      shouldersR: "Right Shoulder",
      biceps: "Left Bicep",
      bicepsR: "Right Bicep",
      forearms: "Left Forearm",
      forearmsR: "Right Forearm",
      abs: "Abs",
      quads: "Left Quad",
      quadsR: "Right Quad",
      calves: "Left Calf",
      calvesR: "Right Calf",
      traps: "Traps",
      upperback: "Upper Back",
      lowerback: "Lower Back",
      triceps: "Left Tricep",
      tricepsR: "Right Tricep",
      glutes: "Glutes",
      hamstrings: "Left Hamstring",
      hamstringsR: "Right Hamstring",
      calvesBack: "Left Calf",
      calvesBackR: "Right Calf"
    };

    const muscleKeywords = {
      chest: ["chest", "bench", "press", "fly", "pec"],
      shoulders: ["shoulder", "press", "lateral", "front raise", "overhead"],
      biceps: ["bicep", "curl", "preacher"],
      triceps: ["tricep", "extension", "pushdown", "dip"],
      forearms: ["forearm", "wrist", "grip"],
      abs: ["abs", "crunch", "plank", "sit-up", "core"],
      quads: ["quad", "squat", "leg press", "lunge", "leg extension"],
      hamstrings: ["hamstring", "leg curl", "deadlift", "romanian"],
      calves: ["calf", "raise"],
      traps: ["trap", "shrug", "upright row"],
      upperback: ["back", "row", "pulldown", "pull-up", "lat"],
      lowerback: ["lower back", "deadlift", "hyperextension"],
      glutes: ["glute", "hip thrust", "squat", "lunge"]
    };

    function identifyMuscleGroup(workoutName) {
      const name = workoutName.toLowerCase();
      for (const [muscle, keywords] of Object.entries(muscleKeywords)) {
        if (keywords.some(kw => name.includes(kw))) {
          return muscle;
        }
      }
      return null;
    }

    function getColor(days) {
      if (days === null || days === 999) return "rgba(255, 255, 255, 0.08)"; // Never trained
      if (days <= 2) return "#10b981";  // Fresh (emerald)
      if (days <= 5) return "#06b6d4";  // Optimal (cyan)
      if (days <= 7) return "#f59e0b";  // Recovery (amber)
      return "#f43f5e";                 // Neglected (rose)
    }

    function getStatus(days) {
      if (days === null || days === 999) return { text: "Never Trained", style: "background:rgba(255,255,255,0.06); color:var(--text-secondary);" };
      if (days <= 2) return { text: "Fresh", style: "background:rgba(16, 185, 129, 0.15); color:#10b981;" };
      if (days <= 5) return { text: "Optimal", style: "background:rgba(6, 182, 212, 0.15); color:#06b6d4;" };
      if (days <= 7) return { text: "Recovery", style: "background:rgba(245, 158, 11, 0.15); color:#f59e0b;" };
      return { text: "Neglected", style: "background:rgba(244, 63, 94, 0.15); color:#f43f5e;" };
    }

    async function loadMuscleData() {
      const user = auth.currentUser;
      if (!user) return;

      try {
        const logsRef = collection(db, "users", user.uid, "logs");
        const q = query(logsRef, orderBy("timestamp", "desc"));
        const snap = await getDocs(q);

        const muscleActivity = {};
        const muscleCount = {};

        snap.forEach(doc => {
          const data = doc.data();
          const workout = data.workout || "";
          const date = data.date;

          const muscle = identifyMuscleGroup(workout);
          if (muscle) {
            if (!muscleActivity[muscle] || new Date(date) > new Date(muscleActivity[muscle])) {
              muscleActivity[muscle] = date;
            }
            muscleCount[muscle] = (muscleCount[muscle] || 0) + 1;
          }
        });

        // Update all muscles
        const today = new Date();
        Object.keys(muscleMap).forEach(id => {
          const baseMuscle = id.replace(/R$/, '').replace(/Back$/, '');
          const date = muscleActivity[baseMuscle];
          const daysAgo = date ? Math.floor((today - new Date(date)) / (1000 * 60 * 60 * 24)) : 999;
          
          const element = document.getElementById(id);
          if (element) {
            element.setAttribute("fill", getColor(daysAgo));
            element.dataset.days = daysAgo;
            element.dataset.lastDate = date || "Never";
            element.dataset.count = muscleCount[baseMuscle] || 0;
          }
        });

        // Update stats
        const trainedMuscles = Object.keys(muscleActivity).length;
        document.getElementById("trainedCount").textContent = trainedMuscles;

        const mostTrainedEntry = Object.entries(muscleCount).sort((a, b) => b[1] - a[1])[0];
        document.getElementById("mostTrained").textContent = mostTrainedEntry ? mostTrainedEntry[0].toUpperCase() : "-";

        const neglected = Object.entries(muscleActivity).filter(([m, date]) => {
          const days = Math.floor((today - new Date(date)) / (1000 * 60 * 60 * 24));
          return days >= 8;
        }).length;
        document.getElementById("needsAttention").textContent = neglected || "0";

      } catch (err) {
        console.error("Error loading muscle data:", err);
      }
    }

    // Modal elements and close actions
    const modal = document.getElementById("muscleModal");
    const closeBtn = document.getElementById("closeMuscleModal");
    const okBtn = document.getElementById("modalOkBtn");

    const closeModal = () => {
      modal.style.opacity = "0";
      setTimeout(() => { modal.style.display = "none"; }, 150);
    };

    closeBtn.addEventListener("click", closeModal);
    okBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });

    // Click handlers
    document.querySelectorAll(".muscle").forEach(el => {
      el.addEventListener("click", e => {
        const id = e.target.id;
        const name = muscleMap[id];
        const days = parseInt(e.target.dataset.days);
        const lastDate = e.target.dataset.lastDate;
        const count = e.target.dataset.count;

        document.getElementById("muscleName").textContent = name;
        document.getElementById("lastTrained").textContent = lastDate === "Never" ? "Never" : new Date(lastDate).toLocaleDateString();
        document.getElementById("daysSince").textContent = days === 999 ? "Never" : `${days} days`;
        document.getElementById("totalWorkouts").textContent = count || 0;

        const status = getStatus(days);
        const statusEl = document.getElementById("muscleStatus");
        statusEl.textContent = status.text;
        statusEl.style.cssText = `font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase; ${status.style}`;

        modal.style.display = "flex";
        setTimeout(() => { modal.style.opacity = "1"; }, 10);
      });
    });

    onAuthStateChanged(auth, user => {
      if (user) loadMuscleData();
      else window.location.href = "login.html";
    });
  </script>
</body>
</html>
