<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    body {
      padding-bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-primary);
      background-image: 
        radial-gradient(at 5% 5%, rgba(6, 182, 212, 0.15) 0px, transparent 40%),
        radial-gradient(at 95% 95%, rgba(99, 102, 241, 0.15) 0px, transparent 40%);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      margin: 20px;
      background: rgba(17, 25, 40, 0.45);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: var(--shadow-premium);
      backdrop-filter: blur(var(--blur-amount));
      -webkit-backdrop-filter: blur(var(--blur-amount));
      position: relative;
    }
    
    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--color-accent), #6366f1);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }

    .auth-container h2 {
      font-size: 26px;
      margin-bottom: 5px;
      text-align: center;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    
    .auth-container p.subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Single block character widget */
    .char-status-widget {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(9, 13, 22, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .avatar-bubble {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(6, 182, 212, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
      animation: floatAvatar 3s ease-in-out infinite alternate;
    }

    @keyframes floatAvatar {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }

    .char-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .char-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .char-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .char-class {
      font-size: 9px;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .char-mini-stats {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .char-stat-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .mini-bar-outer {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
    }

    .mini-bar-inner {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .auth-container button {
      width: 100%;
      margin-top: 10px;
      font-size: 15px;
      padding: 13px;
      background: linear-gradient(135deg, var(--color-accent) 0%, #0891b2 100%);
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);
      font-weight: 700;
    }
    .auth-container button:hover {
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
    }
    #message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Join Gymify 💪</h2>
    <p class="subtitle">Create an account and start playing!</p>

    <!-- Unified Character Status Widget -->
    <div class="char-status-widget">
      <div class="avatar-bubble" id="avatar-icon">⚔️</div>
      <div class="char-info">
        <div class="char-header">
          <span class="char-name" id="hero-name">GymBro_99</span>
          <span class="char-class">LVL.1 RECRUIT</span>
        </div>
        <div class="char-mini-stats">
          <!-- HP Stat -->
          <div class="char-stat-bar">
            <span>HP</span>
            <div class="mini-bar-outer">
              <div class="mini-bar-inner" style="width: 100%; background: var(--color-success);"></div>
            </div>
            <span>100</span>
          </div>
          <!-- PWR Stat (driven by password) -->
          <div class="char-stat-bar">
            <span>PWR</span>
            <div class="mini-bar-outer">
              <div class="mini-bar-inner" id="pwr-bar" style="width: 0%; background: var(--color-danger);"></div>
            </div>
            <span id="pwr-val">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Sign Up Form -->
    <form id="signup-form">
      <label for="signup-username">Username</label>
      <input type="text" id="signup-username" placeholder="GymBro_99" autocomplete="username" required />

      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" placeholder="name@example.com" autocomplete="email" required />
      
      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" placeholder="Min 6 characters" autocomplete="new-password" required />
      
      <button type="submit">Create Account</button>
    </form>
    <p style="margin-top: 20px; margin-bottom: 0; text-align: center; font-size: 13px; color: var(--text-secondary);">
      Already have an account? <a href="login.html">Login here</a>
    </p>
    <div id="message"></div>
  </div>

  <!-- Real-Time UI Dynamics -->
  <script>
    const usernameInput = document.getElementById('signup-username');
    const passwordInput = document.getElementById('signup-password');
    const heroName = document.getElementById('hero-name');
    const avatarIcon = document.getElementById('avatar-icon');
    const pwrVal = document.getElementById('pwr-val');
    const pwrBar = document.getElementById('pwr-bar');

    // Update Name dynamically
    usernameInput.addEventListener('input', (e) => {
      const name = e.target.value.trim();
      heroName.textContent = name || 'GymBro_99';
      
      // Update avatar bubble icons
      const len = name.length;
      if (len === 0) {
        avatarIcon.textContent = '⚔️';
      } else if (len < 5) {
        avatarIcon.textContent = '🏃';
      } else if (len < 10) {
        avatarIcon.textContent = '🏋️';
      } else {
        avatarIcon.textContent = '🔱';
      }
    });

    // Update PWR bar based on password strength
    passwordInput.addEventListener('input', (e) => {
      const pwd = e.target.value;
      const len = pwd.length;
      
      let pwr = 0;
      let barColor = 'var(--color-danger)';
      
      if (len > 0) {
        pwr += Math.min(50, len * 6);
        if (/[0-9]/.test(pwd)) pwr += 20;
        if (/[A-Z]/.test(pwd)) pwr += 15;
        if (/[^A-Za-z0-9]/.test(pwd)) pwr += 15;
      }
      
      pwr = Math.min(100, pwr);
      
      if (pwr >= 80) {
        barColor = 'var(--color-success)';
      } else if (pwr >= 40) {
        barColor = 'var(--color-warning)';
      }
      
      pwrVal.textContent = pwr;
      pwrBar.style.width = `${pwr}%`;
      pwrBar.style.backgroundColor = barColor;
    });
  </script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      updateProfile, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("signup-form");
    const msg = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("signup-username").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;

      if (username.length < 3) {
        msg.textContent = "❌ Username must be at least 3 characters";
        msg.style.color = "var(--color-danger)";
        return;
      }

      msg.textContent = "⏳ Creating character recruit...";
      msg.style.color = "var(--color-warning)";

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await updateProfile(user, { displayName: username });

        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email: email,
          createdAt: serverTimestamp()
        });

        await setDoc(doc(db, "users", user.uid, "data", "profile"), {
          username: username,
          email: email,
          createdAt: serverTimestamp()
        });

        await setDoc(doc(db, "users", user.uid, "data", "stats"), {
          xp: 0,
          streak: 0,
          hearts: 4,
          lastWorkoutDate: null,
          updatedAt: serverTimestamp()
        });

        await setDoc(doc(db, "users", user.uid, "data", "social"), {
          friends: [],
          sentRequests: [],
          receivedRequests: [],
          updatedAt: serverTimestamp()
        });

        msg.textContent = "✅ Guild Character created! Redirecting...";
        msg.style.color = "var(--color-success)";

        setTimeout(() => {
          window.location.href = "profile.html";
        }, 1000);

      } catch (error) {
        console.error("❌ Signup error:", error);
        let errorMsg = "❌ Registration failed: ";
        if (error.code === "auth/email-already-in-use") {
          errorMsg += "Email already registered";
        } else if (error.code === "auth/weak-password") {
          errorMsg += "Password too weak (min 6 characters)";
        } else if (error.code === "auth/invalid-email") {
          errorMsg += "Invalid email format";
        } else {
          errorMsg += error.message;
        }
        msg.textContent = errorMsg;
        msg.style.color = "var(--color-danger)";
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      try {
        const profileRef = doc(db, "users", user.uid, "data", "profile");
        const profileSnap = await getDoc(profileRef);

        if (profileSnap.exists() && profileSnap.data().gymName) {
          window.location.href = "dashboard.html";
        } else {
          window.location.href = "profile.html";
        }
      } catch (e) {
        console.error("Auth redirect checking failed:", e);
      }
    });
  </script>
  <script type="module" src="js/redirectIfLoggedIn.js" defer></script>
</body>
</html>
