<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏋️ My Gym | Gymify</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .checkin-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .checkin-card.active {
      border-color: rgba(16,185,129,0.4);
      background: rgba(16,185,129,0.06);
    }
    .checkin-btn {
      width: 100%;
      margin-top: 10px;
      font-size: 14px;
      padding: 14px;
    }
    .checkin-status {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
    }
    .member-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.2s ease;
    }
    .member-card.checked-in {
      border-color: rgba(16,185,129,0.3);
      background: rgba(16,185,129,0.04);
    }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid var(--color-accent);
      object-fit: cover;
    }
    .live-dot {
      position: absolute; bottom: 0; right: 0;
      width: 12px; height: 12px; border-radius: 50%;
      background: #10b981; border: 2px solid #0d1525;
      box-shadow: 0 0 8px rgba(16,185,129,0.6);
    }
    .member-info { flex: 1; }
    .member-name { font-weight: 600; color: #fff; font-size: 14px; }
    .member-stats { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .at-gym-badge {
      font-size: 10px; font-weight: 700; color: var(--color-success);
      background: rgba(16,185,129,0.12); padding: 2px 8px; border-radius: 8px;
    }
    .loading, .empty { text-align: center; color: var(--text-secondary); padding: 30px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center glow-text" style="margin-top: 15px; margin-bottom: 10px;">🏋️ My Gym</h2>

    <div class="card text-center" style="padding: 15px; border-left: 4px solid var(--color-accent);">
      <p id="gymInfo" style="font-size: 16px; font-weight: 700; color: #fff;">Loading your gym info...</p>
    </div>

    <div class="checkin-card" id="checkinCard">
      <div style="font-size: 28px; margin-bottom: 4px;">📍</div>
      <div style="font-size: 14px; font-weight: 700; color: #fff;">Gym Check-In</div>
      <p style="font-size: 12px; color: var(--text-secondary); margin: 6px 0;">Let your gym buddies know you're training right now</p>
      <button id="checkinBtn" class="btn checkin-btn">✅ I'm at the Gym</button>
      <div class="checkin-status" id="checkinStatus"></div>
    </div>

    <div class="section" style="padding: 15px;">
      <h3 style="font-size: 16px; margin-bottom: 15px; color: var(--color-accent);">👥 Gym Members</h3>
      <div id="gymMembers" class="members-section">
        <p class="loading">Fetching gymmates...</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/mygym.js"></script>
  <script type="module" src="js/navigation.js"></script>
</body>
</html>
