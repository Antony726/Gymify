<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏋️ My Gym | Gymify</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .member-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.2s ease;
    }
    .member-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(6, 182, 212, 0.15);
    }
    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid var(--color-accent);
      object-fit: cover;
    }
    .member-info {
      flex: 1;
    }
    .member-name {
      font-weight: 600;
      color: #fff;
      font-size: 14px;
    }
    .member-stats {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .loading {
      text-align: center;
      color: var(--text-secondary);
      padding: 30px;
      font-size: 14px;
    }
    .empty {
      text-align: center;
      color: var(--text-secondary);
      padding: 30px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center glow-text" style="margin-top: 15px; margin-bottom: 10px;">🏋️ My Gym</h2>
    
    <div class="card text-center" style="padding: 15px; border-left: 4px solid var(--color-accent);">
      <p id="gymInfo" style="font-size: 16px; font-weight: 700; color: #fff;">Loading your gym info...</p>
    </div>

    <div class="section" style="padding: 15px;">
      <h3 style="font-size: 16px; margin-bottom: 15px; color: var(--color-accent);">👥 Other Gym Members</h3>
      <div id="gymMembers" class="members-section">
        <p class="loading">Fetching gymmates...</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/mygym.js"></script>
  <script type="module" src="js/navigation.js"></script>
</body>
</html>
