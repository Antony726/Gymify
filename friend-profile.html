<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friend Profile - Gymify</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    body { padding-bottom: 80px; }

    /* Profile Hero */
    .profile-hero-card {
      background: var(--bg-card);
      backdrop-filter: blur(var(--blur-amount));
      -webkit-backdrop-filter: blur(var(--blur-amount));
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .profile-hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(135deg, rgba(6,182,212,0.08) 0%, rgba(99,102,241,0.06) 100%);
      z-index: 0;
    }
    .hero-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--color-accent);
      object-fit: cover;
      box-shadow: 0 0 20px rgba(6,182,212,0.25);
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.03);
    }
    .hero-name {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-top: 12px;
    }
    .hero-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .hero-stats-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    .hero-stat {
      text-align: center;
    }
    .hero-stat-val {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .hero-stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }
    .hero-badges {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .hero-badge {
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 10px;
      font-weight: 700;
    }
    .hero-badge.cyan {
      background: rgba(6,182,212,0.1);
      color: var(--color-accent);
      border: 1px solid rgba(6,182,212,0.2);
    }
    .hero-badge.purple {
      background: rgba(139,92,246,0.1);
      color: #a78bfa;
      border: 1px solid rgba(139,92,246,0.2);
    }

    /* Section Cards */
    .section-card {
      background: var(--bg-card);
      backdrop-filter: blur(var(--blur-amount));
      -webkit-backdrop-filter: blur(var(--blur-amount));
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .section-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Plan Grid */
    .plan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .day-card {
      background: rgba(9, 13, 22, 0.4);
      border: 1px solid rgba(255,255,255,0.04);
      padding: 12px;
      border-radius: 14px;
      border-left: 3px solid var(--color-accent);
    }
    .day-card h4 {
      font-size: 12px;
      color: var(--color-accent);
      margin-bottom: 5px;
      font-weight: 700;
    }
    .day-card .type {
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 3px;
      color: #fff;
    }
    .day-card .exercises {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .plan-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .plan-actions button {
      flex: 1;
      font-size: 12px;
      padding: 10px;
    }

    /* Chat Section */
    .chat-section {
      border: 1px solid var(--border-color);
      border-radius: 18px;
      overflow: hidden;
      height: 380px;
      display: flex;
      flex-direction: column;
      background: rgba(9, 13, 22, 0.4);
    }
    .chat-header {
      background: rgba(22, 30, 49, 0.8);
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(6,182,212,0.2);
    }
    .chat-header-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-accent);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--color-accent) 0%, #0891b2 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.received {
      align-self: flex-start;
      background: rgba(255,255,255,0.06);
      color: #fff;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .message .time {
      font-size: 9px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      text-align: right;
    }
    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: rgba(13, 21, 37, 0.8);
      border-top: 1px solid var(--border-color);
      align-items: center;
    }
    .chat-input input {
      margin-bottom: 0;
      flex: 1;
      font-size: 13px;
      padding: 10px 14px;
    }
    .chat-input button {
      padding: 10px 16px;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 25px;
    }

    /* Loader */
    .page-loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    .page-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-icon {
      font-size: 48px;
      animation: pulseDumbbell 1.2s infinite alternate;
      margin-bottom: 15px;
    }
    @keyframes pulseDumbbell {
      from { transform: scale(1) rotate(-5deg); }
      to { transform: scale(1.1) rotate(5deg); }
    }
    .loader-text {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Full Page Loader -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-icon">👤</div>
    <div class="loader-text">Loading profile...</div>
  </div>

  <div class="container" style="margin-top: 15px;">
    <div id="profileContent" style="display: none;">
      <!-- Profile Hero -->
      <div class="profile-hero-card">
        <img id="friendAvatar" src="assets/avatars/avatar1.jpg" alt="Avatar" class="hero-avatar">
        <div class="hero-name" id="friendName">Friend Name</div>
        <div class="hero-meta" id="friendGym">🏋️ No gym</div>
        <div class="hero-stats-row">
          <div class="hero-stat">
            <div class="hero-stat-val" id="friendXP">0</div>
            <div class="hero-stat-label">⭐ XP</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-val" id="friendStreak">0</div>
            <div class="hero-stat-label">🔥 Streak</div>
          </div>
        </div>
        <div class="hero-badges" id="heroBadges"></div>
      </div>

      <!-- Workout Plan -->
      <div class="section-card">
        <div class="section-card-title">📋 Weekly Workout Plan</div>
        <div id="workoutPlan" class="plan-grid">
          <div class="empty-state"><p>No workout plan set yet</p></div>
        </div>
        <div class="plan-actions">
          <button id="exportPlanBtn" class="btn btn-secondary" style="font-size:12px;">📤 Export Plan</button>
          <button id="importPlanBtn" class="btn" style="font-size:12px;">📥 Import to Mine</button>
        </div>
      </div>

      <!-- Chat -->
      <div class="section-card" style="padding: 0; overflow: hidden;">
        <div class="chat-section">
          <div class="chat-header">
            <img id="chatAvatar" src="assets/avatars/avatar1.jpg" alt="" class="chat-header-avatar">
            <span class="chat-header-name" id="chatWith">Chat</span>
          </div>
          <div class="chat-messages" id="chatMessages">
            <div class="empty-state"><p>No messages yet. Say hi! 👋</p></div>
          </div>
          <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500" />
            <button id="sendBtn" class="btn">Send</button>
          </div>
        </div>
      </div>
    </div>

    <button class="btn btn-secondary" onclick="window.location.href='friends.html'" style="width: 100%; margin-top: 5px; margin-bottom: 10px; font-size: 13px;">
      ⬅️ Back to Social Hub
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      setDoc,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let friendId = null;
    let chatId = null;

    const pageLoader = document.getElementById("pageLoader");

    function hideLoader() {
      if (pageLoader) {
        pageLoader.classList.add("hidden");
        setTimeout(() => { pageLoader.style.display = "none"; }, 300);
      }
    }

    const params = new URLSearchParams(window.location.search);
    friendId = params.get('id');
    if (!friendId) window.location.href = 'friends.html';

    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    async function loadFriendProfile() {
      try {
        const profileRef = doc(db, "users", friendId, "data", "profile");
        const profileSnap = await getDoc(profileRef);
        const statsRef = doc(db, "users", friendId, "data", "stats");
        const statsSnap = await getDoc(statsRef);

        if (profileSnap.exists()) {
          const profile = profileSnap.data();
          const stats = statsSnap.exists() ? statsSnap.data() : {};

          document.getElementById('friendName').textContent = profile.username || 'Unknown User';
          document.getElementById('friendXP').textContent = stats.xp || 0;
          document.getElementById('friendStreak').textContent = stats.streak || 0;

          if (profile.gymName) {
            document.getElementById('friendGym').textContent = `🏋️ ${profile.gymName} (${profile.gymArea || ''})`;
          }
          if (profile.avatar) {
            document.getElementById('friendAvatar').src = `assets/avatars/${profile.avatar}`;
            document.getElementById('chatAvatar').src = `assets/avatars/${profile.avatar}`;
          }

          // Badges
          const badgesEl = document.getElementById('heroBadges');
          let badgesHTML = '';
          if (profile.fitnessGoal) badgesHTML += `<span class="hero-badge cyan">🎯 ${profile.fitnessGoal}</span>`;
          if (profile.favMusic) badgesHTML += `<span class="hero-badge purple">🎧 ${profile.favMusic}</span>`;
          badgesEl.innerHTML = badgesHTML;

          document.getElementById('chatWith').textContent = profile.username || 'Chat';
        }

        await loadWorkoutPlan();

        document.getElementById('profileContent').style.display = 'block';
        hideLoader();
      } catch (err) {
        console.error(err);
        hideLoader();
        if (window.showToast) window.showToast('Failed to load profile', 'error');
      }
    }

    async function loadWorkoutPlan() {
      const planRef = doc(db, "users", friendId, "data", "plan");
      const planSnap = await getDoc(planRef);
      const planDiv = document.getElementById('workoutPlan');

      if (!planSnap.exists() || Object.keys(planSnap.data()).length === 0) {
        planDiv.innerHTML = '<div class="empty-state"><p>No workout plan set yet</p></div>';
        document.getElementById('exportPlanBtn').disabled = true;
        document.getElementById('importPlanBtn').disabled = true;
        return;
      }

      const plan = planSnap.data();
      planDiv.innerHTML = '';

      days.forEach(day => {
        if (plan[day]) {
          const dayCard = document.createElement('div');
          dayCard.className = 'day-card';
          dayCard.innerHTML = `
            <h4>${day}</h4>
            <div class="type">${plan[day].type || 'Rest'}</div>
            <div class="exercises">${plan[day].exercises || 'No exercises'}</div>
          `;
          planDiv.appendChild(dayCard);
        }
      });
    }

    // Export Plan
    document.getElementById('exportPlanBtn').addEventListener('click', async () => {
      try {
        const planRef = doc(db, "users", friendId, "data", "plan");
        const planSnap = await getDoc(planRef);
        if (!planSnap.exists()) {
          if (window.showToast) window.showToast('No plan to export', 'warning');
          return;
        }
        const encodedPlan = btoa(JSON.stringify(planSnap.data()));
        await navigator.clipboard.writeText(encodedPlan);
        if (window.showToast) window.showToast('✅ Plan copied to clipboard!', 'success');
      } catch (err) {
        console.error(err);
      }
    });

    // Import Plan
    document.getElementById('importPlanBtn').addEventListener('click', async () => {
      if (!confirm('Import this workout plan to your account?')) return;
      try {
        const friendPlanRef = doc(db, "users", friendId, "data", "plan");
        const friendPlanSnap = await getDoc(friendPlanRef);
        if (!friendPlanSnap.exists()) {
          if (window.showToast) window.showToast('No plan to import', 'warning');
          return;
        }
        const myPlanRef = doc(db, "users", currentUser.uid, "data", "plan");
        await setDoc(myPlanRef, friendPlanSnap.data());
        if (window.showToast) window.showToast('✅ Plan imported successfully!', 'success');
      } catch (err) {
        console.error(err);
      }
    });

    // Chat
    function getChatId(uid1, uid2) {
      return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
    }

    function loadChat() {
      chatId = getChatId(currentUser.uid, friendId);
      const messagesRef = collection(db, "chats", chatId, "messages");
      const q = query(messagesRef, orderBy("timestamp", "asc"));

      onSnapshot(q, (snapshot) => {
        const messagesDiv = document.getElementById('chatMessages');
        messagesDiv.innerHTML = '';

        if (snapshot.empty) {
          messagesDiv.innerHTML = '<div class="empty-state"><p>No messages yet. Say hi! 👋</p></div>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const messageEl = document.createElement('div');
          messageEl.className = `message ${msg.senderId === currentUser.uid ? 'sent' : 'received'}`;
          const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          messageEl.innerHTML = `
            <div class="text">${msg.text}</div>
            <div class="time">${time}</div>
          `;
          messagesDiv.appendChild(messageEl);
        });

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      try {
        const messagesRef = collection(db, "chats", chatId, "messages");
        await addDoc(messagesRef, {
          text,
          senderId: currentUser.uid,
          receiverId: friendId,
          timestamp: serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Init
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      await loadFriendProfile();
      loadChat();
    });
  </script>
  <script type="module" src="js/navigation.js"></script>
</body>
</html>
